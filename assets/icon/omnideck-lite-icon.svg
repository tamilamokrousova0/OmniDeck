<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Лайт-вариант иконки: тот же знак, светлая плитка вместо тёмной.
       На светлом фоне сборка отличается от обычной деки с первого взгляда
       даже в доке, где иконка размером с ноготь. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#eef1f6"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#0b0e13" stroke-opacity="0.10"/>
  <g transform="translate(512 512) scale(17) translate(-24 -24)">
  <g fill="none" stroke-width="5.2" stroke-linecap="round">
    <path d="M19.61 38.34 A15 15 0 0 1 9.38 20.63" stroke="#16a866"/>
    <path d="M13.77 13.03 A15 15 0 0 1 34.23 13.03" stroke="#2f6fd0"/>
    <path d="M38.62 20.63 A15 15 0 0 1 28.39 38.34" stroke="#7b4fd4"/>
  </g>
  </g>
  <!-- Подпись под знаком. Размер выбран так, чтобы читалась в доке (там иконка
       ~128 px на retina, то есть кегль ~13 px) и не спорила со знаком. -->
  <text x="512" y="892" text-anchor="middle"
        font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial, sans-serif"
        font-size="74" font-weight="600" letter-spacing="4" fill="#2a3340" fill-opacity="0.72">Lite</text>
</svg>
