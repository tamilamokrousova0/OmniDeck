name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    if: ${{ github.ref_name != 'v0.2.4' }}
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/renderer/dist/ is gitignored — the bundle must be built in CI or
      # the packaged app ships without its renderer (blank window).
      - name: Build renderer bundle
        run: npm run build:renderer

      # whisper.cpp для расшифровки голосовых: статический whisper-cli с
      # встроенным Metal-шейдером (одиночный бинарь без dylib-зависимостей),
      # кладётся в build/whisper/mac → extraResources → Contents/Resources/whisper.
      # ВНИМАНИЕ при включении подписи Developer ID: бинарь в Resources надо
      # будет подписывать отдельно, иначе нотаризация завернёт сборку.
      - name: Build whisper.cpp (voice transcription)
        run: |
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF
          cmake --build /tmp/whisper.cpp/build --target whisper-cli -j 3
          mkdir -p build/whisper/mac
          cp /tmp/whisper.cpp/build/bin/whisper-cli build/whisper/mac/
          ./build/whisper/mac/whisper-cli --help > /dev/null

      # Signing + notarization are driven entirely by secrets: with them the
      # build is Developer-ID-signed and notarized, without them it stays
      # unsigned exactly as before (electron-builder skips on empty env).
      #   CSC_LINK                    — base64 .p12 с сертификатом Developer ID Application
      #   CSC_KEY_PASSWORD            — пароль от .p12
      #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID — нотаризация
      # Missing GitHub secrets arrive as EMPTY STRINGS, and electron-builder
      # treats an empty CSC_LINK as a certificate path ("not a file" error) —
      # so only export the signing vars when the secret is actually set.
      - name: Build mac app
        run: |
          if [ -n "$SEC_CSC_LINK" ]; then export CSC_LINK="$SEC_CSC_LINK"; fi
          if [ -n "$SEC_CSC_KEY_PASSWORD" ]; then export CSC_KEY_PASSWORD="$SEC_CSC_KEY_PASSWORD"; fi
          if [ -n "$SEC_APPLE_ID" ]; then export APPLE_ID="$SEC_APPLE_ID"; fi
          if [ -n "$SEC_APPLE_APP_SPECIFIC_PASSWORD" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$SEC_APPLE_APP_SPECIFIC_PASSWORD"; fi
          if [ -n "$SEC_APPLE_TEAM_ID" ]; then export APPLE_TEAM_ID="$SEC_APPLE_TEAM_ID"; fi
          npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          SEC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SEC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SEC_APPLE_ID: ${{ secrets.APPLE_ID }}
          SEC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SEC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Лайт-сборка: тот же исходник с флагом, отличается productName, appId и
      # каналом обновлений (lite-mac.yml вместо latest-mac.yml) — поэтому
      # апдейтер обычной деки её не видит, и наоборот. Собирается ПОСЛЕ
      # обычной: electron-builder пересоздаёт dist/mac-arm64, но готовые
      # dmg/zip предыдущей сборки в dist/ остаются на месте.
      - name: Build mac lite app
        run: |
          if [ -n "$SEC_CSC_LINK" ]; then export CSC_LINK="$SEC_CSC_LINK"; fi
          if [ -n "$SEC_CSC_KEY_PASSWORD" ]; then export CSC_KEY_PASSWORD="$SEC_CSC_KEY_PASSWORD"; fi
          if [ -n "$SEC_APPLE_ID" ]; then export APPLE_ID="$SEC_APPLE_ID"; fi
          if [ -n "$SEC_APPLE_APP_SPECIFIC_PASSWORD" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$SEC_APPLE_APP_SPECIFIC_PASSWORD"; fi
          if [ -n "$SEC_APPLE_TEAM_ID" ]; then export APPLE_TEAM_ID="$SEC_APPLE_TEAM_ID"; fi
          npm run dist:mac:lite
          # Канал лайта обязан указывать на файлы лайта. Если artifactName
          # когда-нибудь потеряется, lite-mac.yml начнёт ссылаться на обычную
          # сборку — и лайт «обновится» в полную деку. Ловим это здесь.
          test -f dist/lite-mac.yml
          grep -q 'OmniDeck-Lite-.*\.zip' dist/lite-mac.yml
          grep -q 'OmniDeck-.*\.zip' dist/latest-mac.yml
          ! grep -q 'OmniDeck-Lite' dist/latest-mac.yml
        env:
          SEC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SEC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SEC_APPLE_ID: ${{ secrets.APPLE_ID }}
          SEC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SEC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wa-deck-mac
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
            dist/lite-mac.yml
          if-no-files-found: error

  build-win:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/renderer/dist/ is gitignored — the bundle must be built in CI or
      # the packaged app ships without its renderer (blank window).
      - name: Build renderer bundle
        run: npm run build:renderer

      # whisper.cpp для расшифровки голосовых: официальный prebuilt (exe+dll),
      # кладётся в build/whisper/win → extraResources → resources/whisper.
      # spawn идёт с cwd=каталог бинаря, поэтому dll обязаны лежать рядом.
      - name: Fetch whisper.cpp binaries (voice transcription)
        shell: bash
        run: |
          curl -fsSL -o whisper-bin.zip https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-x64.zip
          mkdir -p build/whisper/win
          unzip -j -o whisper-bin.zip -d build/whisper/win
          test -f build/whisper/win/whisper-cli.exe
          # Не только «файл на месте»: бинарь обязан СТАРТОВАТЬ (без нужных
          # DLL рядом он падает, и в приложении это выглядит как «модуль не
          # установлен»). Код возврата у --help ненулевой — проверяем вывод.
          cd build/whisper/win
          ./whisper-cli.exe --help > whisper-help.txt 2>&1 || true
          grep -qiE "usage|whisper|--file" whisper-help.txt
          rm -f whisper-help.txt
          cd ../../..

      # Windows code signing (SmartScreen): подпись включается наличием
      # секретов, без них сборка остаётся неподписанной.
      #   WIN_CSC_LINK         — base64 .pfx с code-signing сертификатом
      #   WIN_CSC_KEY_PASSWORD — пароль от .pfx
      - name: Build win app
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Лайт под Windows: тот же исходник, свой appId и свой канал обновлений
      # (lite.yml вместо latest.yml). Отдельный appId даёт NSIS отдельную
      # установку и отдельные ярлыки, поэтому обычная дека не затирается.
      - name: Build win lite app
        run: |
          npm run dist:win:lite
          if (-not (Test-Path dist/lite.yml)) { throw "lite.yml не создан" }
          if (-not (Select-String -Path dist/lite.yml -Pattern 'OmniDeck-Lite')) { throw "канал лайта ссылается не на лайт" }
          if (Select-String -Path dist/latest.yml -Pattern 'OmniDeck-Lite') { throw "в latest.yml попал лайт" }
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload win artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wa-deck-win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/lite.yml
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - build-win
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts

      - name: Prepare release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          extract() {
            awk -v ver="$1" '
              $0 == "## " ver { capture=1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }
          extract "$version" > release-notes.md
          # Пре-релизы (v0.9.6-preview.1) берут ноты базовой версии (## 0.9.6)
          if [ ! -s release-notes.md ]; then
            extract "${version%%-*}" > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "Release notes for ${version} not found in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name == 'v0.5.1' && 'v0.5.1 — Security hardening, UX polish, Electron 41.1.1' || github.ref_name }}
          draft: false
          # Any tag containing a hyphen (e.g. v0.7.5-preview.1, v1.0.0-rc.2)
          # is treated as a pre-release. electron-updater on the "latest"
          # channel ignores pre-releases by default, so existing users on a
          # stable version won't auto-update into the preview.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.dmg.blockmap
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.zip.blockmap
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.exe.blockmap
            dist-artifacts/**/latest.yml
            dist-artifacts/**/latest-mac.yml
            dist-artifacts/**/lite-mac.yml
            dist-artifacts/**/lite.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure updater metadata assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t metadata_files < <(find dist-artifacts -type f \( -name 'latest.yml' -o -name 'latest-mac.yml' -o -name 'lite-mac.yml' -o -name 'lite.yml' -o -name '*.blockmap' \))
          if [ ${#metadata_files[@]} -eq 0 ]; then
            echo "No updater metadata files found" >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${metadata_files[@]}" --clobber
